name: flutter_application_1
description: "Live Vehicle Tracker - Real-time GPS via MQTT"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Maps & real-time tracking
  google_maps_flutter: ^2.6.0

  # MQTT client for receiving live GPS data from OBD-II dongle / PT30
  mqtt_client: ^10.2.1

  # State management
  provider: ^6.1.2

  # Date/time formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
