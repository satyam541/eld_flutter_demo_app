name: live_location_demo
description: "Live Vehicle Tracker - Real-time GPS via MQTT"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Maps & real-time tracking
  google_maps_flutter: ^2.6.0

  # BLE link to Geometris whereQube
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1

  # HTTP client for posting decoded packets to portal
  http: ^1.2.2

  # Realtime updates from portal back to driver app (optional)
  pusher_channels_flutter: ^2.4.0

  # State management
  provider: ^6.1.2

  # Date/time formatting
  intl: ^0.19.0

  # Persistent settings (driver login, portal URL, paired device)
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
